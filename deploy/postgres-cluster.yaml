# CloudNativePG cluster for yavanna's sensor readings.
#
# imageName is intentionally omitted so the cluster uses the operator's default
# operand image (PostgreSQL 18.x on the homelab's CNPG 1.29) — guaranteed
# compatible with the running operator and keeps new clusters on PG18. Immich
# stays on its own pinned PG16 image; one operator serves both.
#
# CNPG generates a `yavanna-db-app` Secret containing a ready-to-use `uri`
# connection string for the `yavanna` database — the Deployment reads it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: yavanna-db
  namespace: yavanna
spec:
  instances: 1

  # Continuous WAL archiving + daily base backups to Backblaze B2 via the
  # Barman Cloud CNPG-I plugin. Sensor history is the least reproducible data
  # in the cluster — everything else can be re-pulled or re-derived — so this
  # is the one that most wanted covering.
  #
  # The referenced ObjectStore (yavanna-db-b2) and the ScheduledBackup live in
  # the HOMELAB repo under kubernetes/apps/yavanna/, not here. That split is
  # deliberate: they need the B2 credential, which is a SOPS-encrypted Secret,
  # and the Flux Kustomization that syncs this repo has no `decryption:` block,
  # so a Secret committed here would arrive still encrypted. Only the plugin
  # reference has to live alongside the Cluster. ObjectStore is namespaced and
  # the plugin resolves barmanObjectName against this Cluster's own namespace,
  # so both halves land in `yavanna` and find each other.
  #
  # serverName is intentionally omitted: it defaults to the Cluster name, so a
  # restore clone bootstrapped from this store archives under its own prefix
  # rather than writing into this one's.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: yavanna-db-b2

  storage:
    size: 5Gi
    storageClass: nfs-scratch
  bootstrap:
    initdb:
      database: yavanna
      owner: yavanna
  # Expose the read-write endpoint on a stable LAN IP via MetalLB so GUI
  # clients (DataGrip) can connect without a kubectl port-forward. CNPG owns
  # the service (correct primary selector + lifecycle).
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: yavanna-db-lb
              annotations:
                metallb.universe.tf/address-pool: general-pool
                metallb.universe.tf/loadBalancerIPs: "192.168.1.221"
            spec:
              type: LoadBalancer
