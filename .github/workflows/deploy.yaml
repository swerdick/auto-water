name: Deploy

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Tag for the container image (plain semver, e.g. 0.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Tag to build and deploy (e.g. 0.2.0). Select the matching vX.Y.Z tag in 'Use workflow from' to rebuild that release."
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/swerdick/auto-water

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.image-tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
